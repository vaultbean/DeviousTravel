            min: 0
            max: 100
            format: "{0}%"
            default: 50
          - type: slider
            label: "Sex Chance"
            help: "Chance of being assaulted during a forsworn ambush."
            property: DTV_Event_ForswornAmbush.SexChance
            min: 0
            max: 100
            format: "{0}%"
            default: 50
          - type: slider
            label: "Restrain Chance"
            help: "Chance of being restrained during a forsworn ambush."
            property: DTV_Event_ForswornAmbush.RestrainChance
            min: 0
            max: 100
            format: "{0}%"
            default: 10
          - type: slider
            label: "Enslave Chance"
            help: "Chance of being sent to SS++ during a forsworn ambush."
